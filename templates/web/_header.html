{% set header_start %}
    <header class="navbar navbar-expand navbar-dark flex-column flex-md-row ato-navbar px-5">
      <a class="navbar-brand" href="/">
        <img src="/images/cyclonedds-light.png" class="m-1 align-middle" alt="" height="30">
      </a>

      <div class="collapse navbar-collapse">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link{% if page == 'home' %} active{% endif %}" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if page == 'docs' %} active{% endif %}" href="/docs">Documentation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if page == 'faq' %} active{% endif %}" href="/content/faq.html">FAQ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if page == 'deep-dives' %} active{% endif %}" href="/content/deep-dives.html">Deep Dives</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle {% if page == 'guides' %} active{% endif %}" href="#" id="navGuides" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Guides
            </a>
            <ul class="dropdown-menu" aria-labelledby="navGuides">
{% for guide in provider.get_all('guides') %}
              <li><a class="dropdown-item" href="{{ guide.path }}">{{ guide.title }}</a></li>
{% endfor %}
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if page == 'blog' %} active{% endif %}" href="/blog.html">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if page == 'tools' %} active{% endif %}" href="/content/tools.html">Tools</a>
          </li>
        </ul>
      </div>
{% endset %}
{% set header_end %}

      <ul class="navbar-nav flex-row ml-md-auto d-none d-md-flex">
        <li class="nav-item">
          <a class="nav-link p-2" href="https://github.com/eclipse-cyclonedds/cyclonedds" target="_blank" rel="noopener" aria-label="GitHub">
            <span class="fab fa-github fa-lg"></span>
           </a>
        </li>
        <li class="nav-item">
          <a class="nav-link p-2" href="https://x.com/EclipseCyclone" target="_blank" rel="noopener" aria-label="X">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false" style="vertical-align: -.125em"><path d="M18.901 1.153h3.68l-8.041 9.19L24 23.846h-7.406l-5.8-7.584-6.64 7.584H.47l8.601-9.835L0 1.154h7.594l5.243 6.932Zm-1.291 20.491h2.039L6.486 3.24H4.298Z"/></svg>
           </a>
        </li>
        <li class="nav-item">
          <a class="nav-link p-2" href="https://discord.gg/BkRYQPpZVV" target="_blank" rel="noopener" aria-label="Discord">
            <span class="fab fa-discord fa-lg"></span>
           </a>
        </li>
      </ul>
    </header>
{% endset %}
